name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Same path the Bot's setup playbook takes: no pip install of the engine.
      - name: selftest (stdlib only)
        run: python3 -m vidya.cli selftest
      - name: pytest
        run: |
          python3 -m pip install -e ".[test]"
          python3 -m pytest
